name: DVC Remote Check

# Triggered by pull_request_target, not pull_request: the workflow file then
# always comes from main, so a pull request cannot change these steps or the
# same-repository guard below, and the self-hosted runner group can limit the
# runner to this workflow on refs/heads/main. Only branches pushed to this
# repository (by people with write access) run; fork PRs are skipped.
# Because the workflow file comes from main, a PR that edits this file runs
# main's version until it is merged.
on:
  pull_request_target:
    branches: [main]

jobs:
  dvc-check:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, qxub-runner]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install latest dvc_tools
        run: pip install --upgrade git+https://github.com/swarbricklab/dvc_tools.git

      - name: Check DVC remote
        uses: swarbricklab/ci/dvc-remote-check@main
        with:
          dvc-remote: gadi-chromium-processing
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
