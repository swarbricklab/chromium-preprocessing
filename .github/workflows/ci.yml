name: CI

# Lightweight, data-independent checks on the self-hosted NCI qxub-runner (same
# runner as DVC Remote Check), so they don't consume GitHub-hosted Actions
# minutes. They need no FASTQs / references / cellranger. Gated to non-forks
# (forks can't use the self-hosted runner).
#
# Note: snakefmt is not run here — the Snakefile uses conditional `include:`
# statements (inside if/else), which snakefmt/black cannot parse.
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: [self-hosted, qxub-runner]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Dry-run (count + multi) — full DAG + config/schema validation
        run: |
          set -euo pipefail
          source /g/data/a56/conda/miniconda/etc/profile.d/conda.sh
          conda activate snakemake_7.32.4
          bash .tests/ci/setup_placeholders.sh
          export WORKFLOW_ROOT="$PWD"
          for mode in count multi; do
            snakemake -n \
              --workflow-profile profiles/workflow \
              --snakefile Snakefile \
              --configfile config/tests/$mode/config.yaml \
              --default-resources "jobmode='local'"
          done

      - name: snakemake lint (informational)
        continue-on-error: true
        run: |
          source /g/data/a56/conda/miniconda/etc/profile.d/conda.sh
          conda activate snakemake_7.32.4
          export WORKFLOW_ROOT="$PWD"
          snakemake --lint \
            --workflow-profile profiles/workflow \
            --snakefile Snakefile \
            --configfile config/tests/count/config.yaml \
            --default-resources "jobmode='local'"
