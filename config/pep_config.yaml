name: chromium_preprocessing

pep_version: 2.1.0
sample_table: ge_captures.csv
sample_table_index: capture_id


input_data: "data/raw"
results:    "data/processed"
cr_outs:    "data/processed/cr"
resources:  "ref"
transcriptome: "ref/transcriptomes/refdata-gex-GRCh38-2020-A"

sample_modifiers:
  append:
    ge_fastqs: _ge_fq
  derive:
    attributes: [ge_fastqs]
    sources:
      _ge_fq: test_data/raw/GE/{capture_id}