name: chromium_preprocessing

pep_version: 2.1.0
sample_table: ge_captures.csv
sample_table_index: capture_id

# interface
input: 
  ge_fastqs: "data/fastq"
output: 
  cr_outs: "results/cellranger"
resources:
  transcriptome: "resources/transcriptomes/refdata-gex-GRCh38-2020-A"

cite_seq:
  concat_dir: "data/processed/concat"

sample_modifiers:
  append:
    ge_fastqs: _ge_fq
  derive:
    attributes: [ge_fastqs]
    sources:
      _ge_fq: test_data/raw/tiny_tnbc/GE/{capture_id}

