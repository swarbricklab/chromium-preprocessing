cr_version: "7.1.0"
cr_container_publisher: "docker://cumulusprod/cellranger:"

# Options for 'cellranger count'
# See `cellranger count --help` and online documentation 
count:
  activate: True
  flags: "--nosecondary" 

# Options for 'cellranger aggr'
# See `cellranger aggr --help` and online documentation 
aggr:
  activate: True
  flags: "--nosecondary"
  samples: "config/chromium-preprocessing/ge_aggr.tsv"
