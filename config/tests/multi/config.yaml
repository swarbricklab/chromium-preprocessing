# This config file is used for running the workflow on test data

# All paths are relative to the top of the dataset repo

# -- Dependencies -- #
# Files and directories required for the workflow, including raw data, config data and reference data
deps:
  captures: "config/tests/multi/captures.csv"
  libraries: "config/tests/multi/libraries.csv"
  fastqs: "test/data/tiny_pbmc2"

# Reference dependencies
ref:
  # Reference transcriptome for gene expression
  gene-expression: "resources/transcriptomes/refdata-gex-GRCh38-2020-A"
  # Reference for feature barcode antibodies
  feature: "config/feature_barcode_reference.csv"
  # Reference for VDJ-T
  vdj: "resources/vdj/refdata-cellranger-vdj-GRCh38-alts-ensembl-7.1.0"
  # Report templates, CSS, and logo directory
  report_resources: "resources/report"

# -- Outputs -- #
# Files and directories produced by the workflow
outs:
  results: "test/results/cellranger/multi_test"
  reports: "test/results/cellranger/multi_test/reports"
  logs: "logs/chromium-preprocessing"

# -- Module versions --#
# Software module versions (when using environment modules)
modules:
  cellranger: "9.0.1"

# -- Containers --#
# Per-tool images for the non-cellranger rules (everything that used to be a conda
# env). cellranger is NOT here (stays an environment module -- qsub cluster mode).
containers:
  samtools_legacy: "docker://quay.io/biocontainers/samtools:0.1.19--h270b39a_9"
  samtools: "docker://quay.io/biocontainers/samtools:1.22--h96c455f_0"
  csvkit: "docker://ghcr.io/swarbricklab/chromium-preprocessing-csvkit:20261020"
  predemux: "docker://ghcr.io/swarbricklab/chromium-preprocessing-predemux:20261020"
  reports: "docker://ghcr.io/swarbricklab/chromium-preprocessing-reports:20261020"

# -- Parameters --#
# Non-path parameters for tuning the behaviour of the workflow
params:
  extras:
    aggr: false
    annotate: true
    hto: false
    predemux: true
  gene-expression:
    create-bam: true
    no-secondary: false
  aggr:
    normalize: "none"
    no-secondary: false
  predemux:
    # Setting a filter below to -1 will disable (skip) it
    # Values cannot be empty
    min-gene-count: 300 # Integer value
    min-umi-count: 500 # Integer value
    max-mito: -1 # Integer percentage (0 - 100 inclusive))
    mito-pattern: "^MT-" # String value (for mice: "^mt-")
