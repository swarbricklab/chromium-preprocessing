<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{page_title}</title>
<style>
  /* Overall container: two‐column flexbox */
  body {{
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    font-family: sans-serif;
  }}

  /* Sidebar styling */
  .sidebar {{
    flex: 0 0 300px;             /* fixed 300px width */
    background: #f7f7f7;
    border-right: 1px solid #ddd;
    padding: 1rem;
    box-sizing: border-box;
    overflow-y: auto;
  }}
  .sidebar h1 {{
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
  }}
  .sidebar input[type="search"] {{
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    margin-bottom: 1rem;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
  }}
  .sidebar ul {{
    list-style: none;
    padding: 0;
    margin: 0;
  }}
  .sidebar li {{
    margin: 0.25rem 0;
  }}
  .sidebar a {{
    text-decoration: none;
    color: #0366d6;
    display: block;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
  }}
  .sidebar a:hover,
  .sidebar a.active {{
    background: #e1ecf4;
    text-decoration: none;
  }}
  .sidebar .hidden {{
    display: none;
  }}

  /* Content area: iframe */
  .content {{
    flex: 1;                     /* fill remaining width */
    background: #fff;
    overflow: hidden;
    position: relative;
  }}
  .content iframe {{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }}

  /* Footer (timestamp) at bottom of sidebar */
  .footer {{
    margin-top: 1rem;
    font-size: 0.8rem;
    color: #666;
    border-top: 1px solid #ccc;
    padding-top: 0.5rem;
  }}
</style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    {logo_html}
    <h1>{page_title}</h1>
    <label><strong>Filter samples:</strong><br>
      <input id="filter" type="search" placeholder="Type to filter…" />
    </label>
    <ul id="samples">
{items}
    </ul>
    <div class="footer">
      Generated {timestamp}
    </div>
  </div>

  <!-- Content iframe -->
  <div class="content">
    <iframe id="viewer" src=""></iframe>
  </div>

<script>
  // Filter logic: hide/show based on data-name
  const filterInput = document.getElementById("filter");
  const listItems = document.querySelectorAll("#samples li");
  const viewerFrame = document.getElementById("viewer");

  filterInput.addEventListener("input", e => {{
    const term = e.target.value.toLowerCase();
    listItems.forEach(li => {{
      li.classList.toggle("hidden", !li.dataset.name.includes(term));
    }});
  }});

  // Click handler: load into iframe and highlight active link
  listItems.forEach(li => {{
    const link = li.querySelector("a");
    link.addEventListener("click", ev => {{
      ev.preventDefault();
      // Remove active from all
      document.querySelectorAll("#samples a")
              .forEach(a => a.classList.remove("active"));
      link.classList.add("active");
      // Set iframe src
      const url = link.getAttribute("href");
      viewerFrame.setAttribute("src", url);
    }});
  }});

  // On load: auto-load first sample if exists
  if (listItems.length > 0) {{
    const firstLink = listItems[0].querySelector("a");
    firstLink.classList.add("active");
    viewerFrame.setAttribute("src", firstLink.getAttribute("href"));
  }}
</script>

</body>
</html>
