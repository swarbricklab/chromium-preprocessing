<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{page_title}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" href="chromium_reports.css">
</head>
<body>
  <!-- Header with logo-->
  <header class="report-header">{logo_html}</header>

  <div class="main-flex">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <button class="toggle-btn" id="toggleSidebar">
        <i class="bi bi-list"></i>
      </button>
      <div class="sidebar-content">
        <h1>{page_title}</h1>
        {home_link}
        <label><strong>Filter captures:</strong><br>
          <input id="filter" type="search" placeholder="Type to filter…" />
        </label>
        <ul id="samples">
{items}
        </ul>
        <div class="footer">
          Generated {timestamp}
        </div>
      </div>
    </div>
    <!-- Content iframe -->
    <div class="content">
      <iframe id="viewer" src="{iframe_src}"></iframe>
    </div>
  </div>
<script>
  // Sidebar toggle functionality
  const sidebar = document.getElementById("sidebar");
  const toggleBtn = document.getElementById("toggleSidebar");
  
  toggleBtn.addEventListener("click", function() {{
    sidebar.classList.toggle("collapsed");
    // Change icon based on state
    const icon = toggleBtn.querySelector("i");
    if (sidebar.classList.contains("collapsed")) {{
      icon.className = "bi bi-chevron-right";
    }} else {{
      icon.className = "bi bi-list";
    }}
  }});

  // Filter logic: hide/show based on data-name
  const filterInput = document.getElementById("filter");
  const listItems = document.querySelectorAll("#samples li");
  const viewerFrame = document.getElementById("viewer");
  
  // Get the initial src from the iframe (set by {iframe_src})
  const initialSrc = viewerFrame.getAttribute("src");

  filterInput.addEventListener("input", e => {{
    const term = e.target.value.toLowerCase();
    listItems.forEach(li => {{
      li.classList.toggle("hidden", !li.dataset.name.includes(term));
    }});
  }});

  function highlightHomeIfInitial() {{
    const homeLink = document.querySelector('.home-link');
    if (!homeLink) return;
    if (viewerFrame.getAttribute("src") === initialSrc && initialSrc) {{
      homeLink.classList.add("active");
    }} else {{
      homeLink.classList.remove("active");
    }}
  }}

  // Home icon click handler - return to initial state
  const homeLink = document.querySelector('.home-link');
  if (homeLink) {{
    homeLink.addEventListener('click', function(ev) {{
      ev.preventDefault();
      // Remove active from all sidebar links
      document.querySelectorAll("#samples a").forEach(a => a.classList.remove("active"));
      // Set iframe src back to initial src (chromium_summary.html in master index)
      viewerFrame.setAttribute("src", initialSrc);
      // Highlight home icon
      highlightHomeIfInitial();
    }});
  }}

  // Sidebar link click handler
  listItems.forEach(li => {{
    const link = li.querySelector("a");
    link.addEventListener("click", ev => {{
      ev.preventDefault();
      // Remove active from all links including home
      document.querySelectorAll("#samples a").forEach(a => a.classList.remove("active"));
      if (homeLink) homeLink.classList.remove("active");
      // Set this link as active
      link.classList.add("active");
      // Set iframe src
      const url = link.getAttribute("href");
      viewerFrame.setAttribute("src", url);
    }});
  }});

  // On load: auto-load first sample if exists, but only if iframe src is empty
  if (listItems.length > 0 && !viewerFrame.getAttribute("src")) {{
    const firstLink = listItems[0].querySelector("a");
    firstLink.classList.add("active");
    viewerFrame.setAttribute("src", firstLink.getAttribute("href"));
  }} else {{
    // If iframe has initial src, highlight home icon
    highlightHomeIfInitial();
  }}
</script>
</body>
</html>
