# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
# Singularity settings
use-singularity: True
singularity-prefix: /directflow/TumourProgressionGroupTemp/projects/snakecache/
singularity-args: "--bind /scratch_local,/share/ScratchGeneral,/paella/TumourProgressionGroupTemp/projects/dvc,/directflow/TumourProgressionGroupTemp/projects"
# Job settings
jobs: 100
jobname: "{name}.{jobid}.sh"
# Default resource settings
default-resources:
  - cores="2"
  - h_vmem="16G"
  - mem_requested="16G"
  - tmp_requested="10G"
  - tmpfree="10G"
# DRMAA settings
drmaa: "-P TumourProgression -cwd -S /bin/bash -V -b y -j y -pe smp {resources.cores} -l h_vmem={resources.h_vmem},mem_requested={resources.mem_requested},tmp_requested={resources.tmp_requested}"
drmaa-log-dir: logs/drmaa
