# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
# Conda settings
use-conda: True
conda-frontend: mamba
conda-prefix: /directflow/TumourProgressionGroupTemp/projects/snakecache/
# Singularity settings
use-singularity: True
singularity-prefix: /directflow/TumourProgressionGroupTemp/projects/snakecache/
singularity-args: "--bind /scratch_local,/share/ScratchGeneral,/paella/TumourProgressionGroupTemp/projects/dvc,/directflow/TumourProgressionGroupTemp/projects"
# Job settings
jobs: 100
jobname: "{name}.{jobid}.sh"
# Default resource settings
default-resources:
  - threads="2"
  - mem="16GB"
  - disk="10"
  - mem_per_core_mb=lambda wildcards, resources: int({resources.mem_mb}/{resources.threads})
  - disk_per_core_mb=lambda wildcards, resoures: int({resources.mem_mb}/{resources.threads})
# DRMAA settings
drmaa: "-P TumourProgression -cwd -S /bin/bash -V -b y -j y -pe smp {resources.threads} -l h_vmem={resources.mem_per_core_mb}M,mem_requested={resources.mem_per_core_mb}M,tmp_requested={resources.disk_per_core_mb}M,tmpfree={resources.disk_per_core_mb}M"
drmaa-log-dir: logs/drmaa
