# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
# Conda settings
use-conda: True
conda-frontend: mamba
conda-prefix: /directflow/TumourProgressionGroupTemp/projects/snakecache/
# Singularity settings
use-singularity: True
singularity-prefix: /directflow/TumourProgressionGroupTemp/projects/snakecache/
singularity-args: "--bind /scratch_local,/share/ScratchGeneral,/paella/TumourProgressionGroupTemp/projects/dvc,/directflow/TumourProgressionGroupTemp/projects"
# Job settings
jobs: 100
jobname: "{name}.{jobid}.sh"
# Default resource settings
default-resources:
  - threads="2"
  - mem_gb="16"
  - disk_gb="10"
# DRMAA settings
drmaa: "-P TumourProgression -cwd -S /bin/bash -V -b y -j y -pe smp {resources.threads} -l h_vmem={resources.mem_gb}G,mem_requested={resources.mem_gb}G,tmp_requested={resources.disk_gb}G,tmpfree={resources.disk_gb}G"
drmaa-log-dir: logs/drmaa
