# Resource specifications for PBS Jobs

# Keys are mapped to PBS resources specifications via key_mappings.yaml

# Default resource requests for all jobs. Can be over-ridden
__default__:
  project: a56
  storage: gdata/a56
  queue: normal
  operand: --
  cwd: wd
  V: V
  join: oe
  output: logs/chromium-preprocessing/{rulename}.{jobid}.log
  error: logs/chromium-preprocessing/{rulename}.{jobid}.log

