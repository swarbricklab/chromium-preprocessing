# environment.yaml for the predemux filtering workflow
name: predemux
channels:
  - conda-forge
  - bioconda
  - default
dependencies:
  # --- R Dependencies ---
  - r-base >=4.2 
  - r-argparser 
  - r-seurat =5.2 
  - r-seuratobject 
  - r-tidyverse 
  - bioconda::bioconductor-dropletutils 
  - r-matrix 

  # --- Python Dependencies ---
  - python >=3.8 
  - pandas 
  - numpy
  - matplotlib 