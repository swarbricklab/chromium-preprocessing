# Snakemake options (can be over-ridden from the command line)
restart-times: 0
rerun-incomplete: true
keep-going: false
# Conda settings (required for rules that use conda environments)
use-conda: True
conda-frontend: mamba
# Environmen modules
use-envmodules: True

# Resource settings per rule
set-resources:
  cellranger_count: 
        threads: "1"
        mem: "4GB"
        # Resources used by spaceranger to dispace jobs in cluster mode
        mempercore: 8 #GB
        maxjobs: 100
        jobinterval: 2000
  cr_summarise:
        threads: "1"
        mem: "8GB"
        disk: "100MB"
  generate_aggr_csv:
        threads: "1"
        mem: "16GB"
        disk: "100MB"
  cellranger_aggr:
        threads: "16"
        mem: "110GB"
        disk: "100GB"
  merge_bams:
        threads: "1"
        mem: "16GB"
        disk: "100MB"
        runtime: "24h"  
