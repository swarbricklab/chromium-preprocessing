__use_yte__: true

__definitions__:
  - import os

# Snakemake options (can be over-ridden from the command line)
restart-times: 0
rerun-incomplete: true
keep-going: false
# Conda settings (required for rules that use conda environments)
use-conda: True
conda-frontend: mamba
# Environmen modules
use-envmodules: True

# Resource settings per rule
set-resources:
    cellranger_count: 
        threads: "1"
        mem: "4GB"
        runtime: "16h"
        # Resources used by cellranger to dispatch jobs in cluster mode
        mempercore: 8 #GB
        maxjobs: 25
        jobinterval: 2000
        override: ?os.getenv("WORKFLOW_ROOT")+"/profiles/workflow/override.json"
    cr_summarise:
        threads: "1"
        mem: "8GB"
        disk: "100MB"
    generate_aggr_count_csv:
        threads: "1"
        mem: "16GB"
        disk: "100MB"
    generate_aggr_vdj_csv:
        threads: "1"
        mem: "16GB"
        disk: "100MB"
    cellranger_aggr_count:
        threads: "1"
        mem: "4GB"
        runtime: "1600"
        # Resources used by cellranger to dispatch jobs in cluster mode
        mempercore: 8 #GB
        maxjobs: 100
        jobinterval: 2000
    cellranger_aggr_vdj:
        threads: "1"
        mem: "4GB"
        # Resources used by cellranger to dispatch jobs in cluster mode
        mempercore: 8 #GB
        maxjobs: 100
        jobinterval: 2000
    merge_bams:
        threads: "1"
        mem: "16GB"
        disk: "100MB"
        runtime: "24h"
    index_merged_bams:
        threads: "1"
        mem: "24GB"
        disk: "100MB"
    cellranger_multi: 
        threads: "1"
        mem: "2GB"
        # Resources used by cellranger to dispatch jobs in cluster mode
        mempercore: 8 #GB
        maxjobs: 100
        jobinterval: 2000
    select_libraries:
        threads: "1"
        mem: "2GB"
    create_ini:
        threads: "1"
        mem: "2GB"
    combine_dynamic_config:
        threads: "1"
        mem: "2GB"
    restructure_outs:
        threads: "1"
        mem: "4GB"
    cloud_auth:
        threads: "1"
        mem: "4GB"
        queue: "copyq"
    annotate:
        threads: "1"
        mem: "4GB"
        queue: "copyq"
        runtime: "1h"
    # Predemux rules
    predemux_convert_to_seurat:
        threads: "1"
        mem: "20GB"
        runtime: "1h"
    predemux_filter_seurat:
        threads: "1"
        mem: "20GB"
        runtime: "1h"
    predemux_gather_qc_metrics:
        threads: "1"
        mem: "20GB"
        runtime: "1h"
    predemux_generate_report:
        threads: "1"
        mem: "4GB"
        runtime: "1h"